
name: CI Tests & SonarCloud


on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt + system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-xcb1 \
            libxcb1 \
            libxcb-render0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-shm0 \
            libxcb-xinerama0 \
            libxcb-xinerama0-dev \
            libxkbcommon-x11-0 \
            libxkbcommon0 \
            libxrender1 \
            libfontconfig1 \
            libfreetype6 \
            libgl1 libegl1 \
            libglib2.0-0 \
            libnss3 \
            libasound2t64 \
            xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Install project in editable mode
        run: pip install -e .

      - name: Run tests with xvfb (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          xvfb-run -a coverage run -m unittest discover -s tests -p "test_*.py" -v
          coverage xml -o coverage.xml
          coverage report

      - name: Check Sonar token availability
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "SONAR_TOKEN not set; skipping SonarCloud scan.";
          else
            echo "SONAR_TOKEN is set; proceeding with SonarCloud scan.";
          fi

      - name: SonarCloud Scan
        if: ${{ secrets.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}